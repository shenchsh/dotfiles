"$schema" = 'https://starship.rs/config-schema.json'

# A compact prompt: directory, Git branch/status, and command result.
add_newline = false
format = '$directory$git_branch$git_status$character'

[directory]
truncation_length = 3
style = 'bold cyan'

[git_branch]
symbol = 'git:'
style = 'bold purple'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
